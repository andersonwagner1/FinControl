<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="Finora, início">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M7 22.5 13.2 16l4.4 4.5L25 11" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M19.5 11H25v5.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <span>finora</span>
    </a>

    <div class="sidebar-label">MENU PRINCIPAL</div>
    <nav class="main-nav" aria-label="Menu principal">
      <a routerLink="/dashboard-financeiro" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 19V5M3 19h18M7 15l4-5 3 2 5-7" /></svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" /></svg>
        <span>Movimentação</span>
      </a>
     
      <a routerLink="/cartoes-credito" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 10h18M7 15h3" /></svg>
        <span>Cartão de crédito</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="sidebar-label">SUA CONTA</div>
      <div class="profile">
        <div class="avatar">AO</div>
        <div class="profile-info"><strong>Anderson Oliveira</strong><span>Conta pessoal</span></div>
        <span class="profile-dots" aria-hidden="true">···</span>
      </div>
      <div class="sidebar-footer">Organize hoje. Viva tranquilo.</div>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <div class="breadcrumb"><span>Finanças</span><span class="breadcrumb-separator">/</span><strong>Controle financeiro</strong></div>
      <div class="topbar-actions">
        <span class="today">{{ anoAtual }}</span>
        <div class="top-avatar" aria-label="Perfil de Anderson">AO</div>
      </div>
    </header>
    <section class="page-content">
      <router-outlet />
    </section>
  </main>
</div>
